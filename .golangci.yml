version: "2"
linters:
  default: standard
  disable:
    - errcheck
  settings:
    funlen:
      lines: 80
      statements: -1
    gocognit:
      min-complexity: 30
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocognit
formatters:
  enable:
    - gofmt
